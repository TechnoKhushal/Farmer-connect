<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Farmer Connect</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="login-container">
    <form id="login-form" class="login-form" novalidate>

      <h1>Login / Signup</h1>

      <div class="form-group">
        <label for="email">Username / Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
        >
        <span class="error-message" id="email-error"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >
        <span class="error-message" id="password-error"></span>
      </div>

      <div class="form-group">
        <label for="role">Role: Farmer / Consumer / Admin</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="farmer">Farmer</option>
          <option value="consumer">Consumer</option>
          <option value="admin">Admin</option>
        </select>
        <span class="error-message" id="role-error"></span>
      </div>

      <span class="error-message" id="form-error"></span>

      <button type="submit" id="login-button" class="btn-primary">
        Login
      </button>

      <p class="signup-link">
        <a href="signup.html">Sign Up</a>
      </p>

    </form>
  </main>

  <script src="../js/login.js"></script>
</body>
</html>
